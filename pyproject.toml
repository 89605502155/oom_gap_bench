[project]
name = "sydost-oom-bench"
version = "0.0.3"
description = "Simulation bench for process failures between RAM monitoring points (OOM gap) and their accounting methods"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Andrey Ferubko", email = "ferubko1999@yandex.ru" },
    { name = "Oleg Kazakov", email = "kazakov@bgitu.ru" },
]
requires-python = ">=3.11,<3.15"
keywords = ["kvm", "memory", "oom", "monitoring", "simulation", "censored data"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Topic :: System :: Monitoring",
]
dependencies = ["numpy>=1.26", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/89605502155/sydost-oom-bench"
Repository = "https://github.com/89605502155/sydost-oom-bench"
Issues = "https://github.com/89605502155/sydost-oom-bench/issues"
Changelog = "https://github.com/89605502155/sydost-oom-bench/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sydost_oom_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Длинные строки в скриптах с русскими подписями рисунков и сообщениями допустимы.
per-file-ignores = { "scripts/*" = ["E501"] }
